<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <rect width="1200" height="630" fill="#0F172A"/>

  <!-- Animated background elements -->
  <circle cx="200" cy="150" r="150" fill="url(#grad1)" opacity="0.1"/>
  <circle cx="1000" cy="480" r="180" fill="url(#grad2)" opacity="0.1"/>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F472B6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main content -->
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#A5B4FC">
    Artem Antonenko
  </text>

  <text x="100" y="210" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="#60A5FA">
    Engineering &amp; AI Transformation Executive
  </text>

  <!-- Divider line -->
  <rect x="100" y="240" width="120" height="4" fill="url(#textGrad)" rx="2"/>

  <!-- Value propositions -->
  <text x="100" y="310" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#E2E8F0">
    Building High-Performing Engineering Teams
  </text>

  <text x="100" y="360" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#E2E8F0">
    Powered by Practical AI Adoption
  </text>

  <!-- Stats section -->
  <g transform="translate(100, 420)">
    <!-- Stat 1 -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#textGrad)">
      500+
    </text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="18" fill="#94A3B8">
      Professionals Led
    </text>

    <!-- Stat 2 -->
    <text x="250" y="0" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#textGrad)">
      8x ROI
    </text>
    <text x="250" y="35" font-family="Arial, sans-serif" font-size="18" fill="#94A3B8">
      AI Implementation
    </text>

    <!-- Stat 3 -->
    <text x="500" y="0" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#textGrad)">
      70%
    </text>
    <text x="500" y="35" font-family="Arial, sans-serif" font-size="18" fill="#94A3B8">
      Workload Reduction
    </text>

    <!-- Stat 4 -->
    <text x="750" y="0" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#textGrad)">
      12
    </text>
    <text x="750" y="35" font-family="Arial, sans-serif" font-size="18" fill="#94A3B8">
      Companies Transformed
    </text>
  </g>

  <!-- Footer -->
  <text x="100" y="590" font-family="Arial, sans-serif" font-size="20" fill="#64748B">
    Leading Enterprise AI Transformation | Engineering Excellence
  </text>
</svg>
